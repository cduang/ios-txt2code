# =============================================================================
# QRCodeApp - GitHub Actions CI/CD
# =============================================================================
# 自动构建流程：
#   1. 推送到 main 分支 → 自动触发
#   2. 根据日期生成版本号 (2026.0511.1)
#   3. 自动创建 git tag 并推送
#   4. XcodeGen 生成项目 → 生成图标 → 编译 → 打包 .ipa/.tipa
#   5. 上传 Artifacts + 发布到 GitHub Releases
#
# 产物：
#   - .ipa  → SideStore / AltStore 安装
#   - .tipa → TrollStore 安装
# =============================================================================
name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_NAME: QRCodeApp
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  version:
    name: Generate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Generate Version (YYYY.MMDD.RunNum)
        id: version
        run: |
          DATE_TAG=$(date -u +"%Y.%m%d")
          VERSION="${DATE_TAG}.${{ github.run_number }}"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "📌 Version: ${VERSION}"
          echo "🏷️  Tag: ${TAG}"

  build:
    name: Build & Package
    needs: version
    runs-on: macos-15
    # macOS 15 (Sequoia) → Xcode 16+ → Swift 6 原生支持

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show Build Environment
        run: |
          swift --version
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml --use-cache

      - name: Generate App Icons
        run: swift Scripts/generate_app_icon.swift

      - name: Update Version in Info.plist
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ needs.version.outputs.version }}" QRCodeApp/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" QRCodeApp/Info.plist
          echo "✅ Version updated to: ${{ needs.version.outputs.version }} (build ${{ github.run_number }})"

      - name: Build iOS App (Release)
        run: |
          xcodebuild build \
            -project "${{ env.PROJECT_NAME }}.xcodeproj" \
            -scheme "${{ env.PROJECT_NAME }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PRODUCT_BUNDLE_IDENTIFIER="com.qrcodetool.app" \
            SWIFT_OPTIMIZATION_LEVEL="-O" \
            CLANG_ENABLE_MODULES=YES \
            -derivedDataPath ./Build \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcbeautify

      - name: Locate .app Bundle
        id: find_app
        run: |
          APP_PATH=$(find ./Build -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app bundle not found!"
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "Found .app at: $APP_PATH"

      - name: Create Payload & .ipa
        run: |
          mkdir -p Payload
          cp -R "${{ steps.find_app.outputs.APP_PATH }}" Payload/
          zip -qr "${{ env.PROJECT_NAME }}.ipa" Payload/
          echo "✅ IPA: $(ls -lh ${{ env.PROJECT_NAME }}.ipa)"

      - name: Convert to .tipa (TrollStore)
        run: |
          cp "${{ env.PROJECT_NAME }}.ipa" "${{ env.PROJECT_NAME }}.tipa"
          echo "✅ TIPA: $(ls -lh ${{ env.PROJECT_NAME }}.tipa)"

      # 始终上传构建产物
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QRCodeApp-${{ needs.version.outputs.version }}
          path: |
            ${{ env.PROJECT_NAME }}.ipa
            ${{ env.PROJECT_NAME }}.tipa
          if-no-files-found: error

      # 创建 git tag 并推送
      - name: Create and Push Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ needs.version.outputs.tag }}"
          git push origin "${{ needs.version.outputs.tag }}"
          echo "✅ Tag created: ${{ needs.version.outputs.tag }}"

      # 发布 Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: "QR码工具 v${{ needs.version.outputs.version }}"
          body: |
            ## 📱 QR码工具 v${{ needs.version.outputs.version }}

            ### ✅ 隐私承诺
            - 完全离线运行，零网络访问
            - 所有数据仅在本地处理
            - 无追踪、无分析、无数据收集

            ### 📦 安装方式
            | 文件 | 工具 |
            |-----|------|
            | `QRCodeApp.tipa` | TrollStore 直接安装 |
            | `QRCodeApp.ipa`  | SideStore / AltStore 安装 |

            ### 🛠 功能
            - **生成**：输入文本 → 实时高清二维码（支持保存到相册）
            - **扫描**：相机实时扫码识别
            - **识别**：相册图片二维码识别
            - **复制**：识别结果一键复制

            ### ⚠️ 系统要求
            - iOS 16.0+
            - A12 Bionic 或更新芯片（DataScanner 需要）
          files: |
            ${{ env.PROJECT_NAME }}.ipa
            ${{ env.PROJECT_NAME }}.tipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
