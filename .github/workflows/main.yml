# =============================================================================
# QRCodeApp - GitHub Actions CI/CD
# =============================================================================
# 使用 XcodeGen 从 project.yml 自动生成 .xcodeproj，无需手动创建 Xcode 项目
#
# 触发方式：
#   - 推送 tag (v*) → 自动构建并发布 Release
#   - workflow_dispatch → 手动触发
#
# 产物：
#   - .ipa  → SideStore / AltStore 安装
#   - .tipa → TrollStore 安装
# =============================================================================
name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: false
        default: '1.0.0'

env:
  PROJECT_NAME: QRCodeApp
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  build:
    name: Build & Package
    runs-on: macos-15
    # macOS 15 (Sequoia) → Xcode 16+ → Swift 6 原生支持

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Build Environment
        run: |
          swift --version
          xcodebuild -version
          echo "XcodeGen: $(brew list xcodegen 2>/dev/null && echo 'installed' || echo 'not installed')"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml --use-cache
        # 从 project.yml 生成 QRCodeApp.xcodeproj

      - name: Build iOS App (Release)
        run: |
          xcodebuild build \
            -project "${{ env.PROJECT_NAME }}.xcodeproj" \
            -scheme "${{ env.PROJECT_NAME }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PRODUCT_BUNDLE_IDENTIFIER="com.qrcodetool.app" \
            SWIFT_OPTIMIZATION_LEVEL="-O" \
            CLANG_ENABLE_MODULES=YES \
            -derivedDataPath ./Build \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcbeautify

      - name: Locate .app Bundle
        id: find_app
        run: |
          APP_PATH=$(find ./Build -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app bundle not found!"
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "Found .app at: $APP_PATH"

      - name: Create Payload & .ipa
        run: |
          mkdir -p Payload
          cp -R "${{ steps.find_app.outputs.APP_PATH }}" Payload/
          zip -qr "${{ env.PROJECT_NAME }}.ipa" Payload/
          echo "✅ IPA: $(ls -lh ${{ env.PROJECT_NAME }}.ipa)"

      - name: Convert to .tipa (TrollStore)
        run: |
          cp "${{ env.PROJECT_NAME }}.ipa" "${{ env.PROJECT_NAME }}.tipa"
          echo "✅ TIPA: $(ls -lh ${{ env.PROJECT_NAME }}.tipa)"

      - name: Create GitHub Release
        # 仅在推送 tag 时创建 Release（workflow_dispatch 手动触发时跳过）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "QR码工具 v${{ github.ref_name }}"
          body: |
            ## 📱 QR码工具 v${{ github.ref_name }}

            ### ✅ 隐私承诺
            - 完全离线运行，零网络访问
            - 所有数据仅在本地处理
            - 无追踪、无分析、无数据收集

            ### 📦 安装方式
            | 文件 | 工具 |
            |-----|------|
            | `QRCodeApp.tipa` | TrollStore 直接安装 |
            | `QRCodeApp.ipa`  | SideStore / AltStore 安装 |

            ### 🛠 功能
            - **生成**：输入文本 → 实时高清二维码（支持保存到相册）
            - **扫描**：相机实时扫码识别
            - **识别**：相册图片二维码识别
            - **复制**：识别结果一键复制

            ### ⚠️ 系统要求
            - iOS 16.0+
            - A12 Bionic 或更新芯片（DataScanner 需要）
          files: |
            ${{ env.PROJECT_NAME }}.ipa
            ${{ env.PROJECT_NAME }}.tipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
