# XcodeGen 项目配置
# 文档：https://github.com/Yonat/MissingSwiftUI?tab=readme-ov-file
# 安装：brew install xcodegen
name: QRCodeApp
options:
  bundleIdPrefix: com.qrcodetool
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1" # iPhone only
    INFOPLIST_FILE: QRCodeApp/Info.plist

targets:
  QRCodeApp:
    type: application
    platform: iOS
    sources:
      - path: QRCodeApp
        # 排除非源代码文件
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qrcodetool.app
        INFOPLIST_FILE: QRCodeApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # 禁用位码（TrollStore 要求）
        ENABLE_BITCODE: NO
        # Release 优化
        configs:
          Release:
            SWIFT_OPTIMIZATION_LEVEL: "-O"
            SWIFT_COMPILATION_MODE: wholemodule
